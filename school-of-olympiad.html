<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School of Olympiad — Prepare with precision. Compete with confidence.</title>
<meta name="description" content="One platform for every STEM olympiad: curated problems, adaptive practice, real analytics, and a clear path from your first question to the international stage.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23A6790A' stroke-width='2'/%3E%3Ccircle cx='16' cy='5.3' r='2.3' fill='%23A6790A'/%3E%3Cpath d='M11 16.6l3.3 3.3 6.6-7.4' fill='none' stroke='%232447B6' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>

/* ======================================================================
   SCHOOL OF OLYMPIAD — DESIGN SYSTEM
   Signature idea: the interface reads like a well-kept problem set /
   exam paper crossed with a lab instrument readout — hairline rules,
   numbered problems with point values, monospace data, restrained color.
   ====================================================================== */

/* ---------- Fonts ---------- */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ---------- Tokens ---------- */
:root{
  /* base palette — light */
  --bg:#FFFFFF;
  --bg-dim:#F4F5F7;
  --bg-sunk:#EAEDF1;
  --bg-raised:#FFFFFF;
  --text:#10151F;
  --text-soft:#3A4152;
  --text-mute:#6B7385;
  --line:#DCDFE5;
  --line-soft:#EBEDF1;

  /* brand accents */
  --gold:#A6790A;
  --gold-ink:#7A5A08;
  --gold-soft:#F6ECD2;
  --cobalt:#2447B6;
  --cobalt-ink:#1B368C;
  --cobalt-soft:#E4E9FB;

  --success:#177A54;
  --success-soft:#DDF1E7;
  --danger:#B23B24;
  --danger-soft:#FBE4DE;
  --warn:#9A6B0C;
  --warn-soft:#F7ECD3;

  /* subject accents */
  --sub-math:#2447B6;
  --sub-physics:#7A3FA0;
  --sub-chem:#177A54;
  --sub-bio:#B23B24;
  --sub-cs:#0F766E;
  --sub-astro:#3730A3;
  --sub-earth:#8A5A22;
  --sub-eng:#475569;
  --sub-ai:#B5460C;

  /* type */
  --font-display:'Fraunces', ui-serif, Georgia, serif;
  --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;

  /* scale */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px; --space-9:96px;

  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-full:999px;

  --shadow-sm:0 1px 2px rgba(16,21,31,0.06);
  --shadow-md:0 4px 16px rgba(16,21,31,0.08);
  --shadow-lg:0 12px 40px rgba(16,21,31,0.14);

  --header-h:68px;
  color-scheme: light;
}

html[data-theme="dark"]{
  --bg:#0B1119;
  --bg-dim:#0F1626;
  --bg-sunk:#141C2E;
  --bg-raised:#131B2B;
  --text:#EAEDF3;
  --text-soft:#C3C9D6;
  --text-mute:#8891A3;
  --line:#232D42;
  --line-soft:#1B2438;

  --gold:#E0B84A;
  --gold-ink:#F3D888;
  --gold-soft:#2C2412;
  --cobalt:#7C9AF0;
  --cobalt-ink:#AFC1F5;
  --cobalt-soft:#161E36;

  --success:#4FCB94;
  --success-soft:#0F2A20;
  --danger:#F1806A;
  --danger-soft:#301711;
  --warn:#E0B84A;
  --warn-soft:#2C2412;

  --sub-math:#7C9AF0;
  --sub-physics:#C79BE8;
  --sub-chem:#4FCB94;
  --sub-bio:#F1806A;
  --sub-cs:#5FD0C4;
  --sub-astro:#9FA6F5;
  --sub-earth:#D2A25C;
  --sub-eng:#9AA6BC;
  --sub-ai:#F0A06B;

  color-scheme: dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease, color .2s ease;
}
img,svg{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
h1,h2,h3,h4{ font-family:var(--font-display); margin:0; font-weight:600; letter-spacing:-0.01em; color:var(--text); }
p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
button{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--cobalt); outline-offset:2px; border-radius:4px; }

.container{ max-width:1240px; margin:0 auto; padding:0 var(--space-5); }
@media (max-width:640px){ .container{ padding:0 var(--space-4); } }

.eyebrow{
  font-family:var(--font-mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--text-mute); display:flex; align-items:center; gap:var(--space-2);
}
.eyebrow::before{ content:""; width:16px; height:1px; background:var(--gold); display:inline-block; }

.section{ padding:var(--space-8) 0; }
@media (max-width:640px){ .section{ padding:var(--space-7) 0; } }
.section-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--space-5); margin-bottom:var(--space-6); flex-wrap:wrap; }
.section-title{ font-size:32px; margin-top:var(--space-2); }
.section-sub{ color:var(--text-mute); max-width:560px; margin-top:var(--space-2); font-size:15px; }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
  font-family:var(--font-body); font-weight:600; font-size:14.5px;
  padding:11px 20px; border-radius:var(--radius-sm); border:1px solid transparent;
  cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, background .15s ease, border-color .15s ease, color .15s ease;
  white-space:nowrap;
}
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--text); color:var(--bg); }
html[data-theme="dark"] .btn-primary{ background:var(--gold); color:#141019; }
.btn-primary:hover{ box-shadow:var(--shadow-md); }
.btn-gold{ background:var(--gold); color:#FFFDF8; }
html[data-theme="dark"] .btn-gold{ color:#1A1408; }
.btn-gold:hover{ box-shadow:0 6px 20px rgba(166,121,10,.28); }
.btn-outline{ background:transparent; border-color:var(--line); color:var(--text); }
.btn-outline:hover{ border-color:var(--text-mute); background:var(--bg-dim); }
.btn-ghost{ background:transparent; color:var(--text-soft); }
.btn-ghost:hover{ background:var(--bg-dim); }
.btn-sm{ padding:7px 14px; font-size:13px; }
.btn-lg{ padding:14px 26px; font-size:15.5px; }
.btn-block{ width:100%; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn-icon{ width:38px; height:38px; padding:0; border-radius:var(--radius-sm); background:transparent; border:1px solid var(--line); color:var(--text-soft); }
.btn-icon:hover{ background:var(--bg-dim); }

/* ---------- Icons (inline stroke style) ---------- */
.icon{ width:18px; height:18px; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

/* ---------- Cards ---------- */
.card{
  background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-md);
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.card-hover:hover{ border-color:var(--text-mute); box-shadow:var(--shadow-md); transform:translateY(-2px); }

/* ---------- Badges & tags ---------- */
.badge{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono);
  font-size:11.5px; letter-spacing:.03em; padding:4px 9px; border-radius:var(--radius-full);
  border:1px solid var(--line); color:var(--text-soft); background:var(--bg-dim);
}
.badge-dot::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.badge-gold{ background:var(--gold-soft); color:var(--gold-ink); border-color:transparent; }
.badge-cobalt{ background:var(--cobalt-soft); color:var(--cobalt-ink); border-color:transparent; }
.badge-success{ background:var(--success-soft); color:var(--success); border-color:transparent; }
.badge-danger{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }
.badge-warn{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }

.subject-chip{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--sc); }
.subject-chip::before{ content:""; width:8px; height:8px; border-radius:2px; background:var(--sc); display:inline-block; }
.sc-mathematics{ --sc:var(--sub-math); } .sc-physics{ --sc:var(--sub-physics); } .sc-chemistry{ --sc:var(--sub-chem); }
.sc-biology{ --sc:var(--sub-bio); } .sc-computer-science{ --sc:var(--sub-cs); } .sc-astronomy{ --sc:var(--sub-astro); }
.sc-earth-science{ --sc:var(--sub-earth); } .sc-engineering{ --sc:var(--sub-eng); } .sc-ai-data-science{ --sc:var(--sub-ai); }

.diff-dots{ display:inline-flex; gap:3px; align-items:center; }
.diff-dots i{ width:6px; height:6px; border-radius:50%; background:var(--line); display:inline-block; }
.diff-dots i.on{ background:var(--gold); }

/* ---------- Layout: header / nav ---------- */
.site-header{
  position:sticky; top:0; z-index:60; height:var(--header-h);
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.site-header .container{ height:100%; display:flex; align-items:center; justify-content:space-between; gap:var(--space-5); }
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:600; font-size:19px; flex-shrink:0; }
.brand-mark{ width:32px; height:32px; }
.brand small{ display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.16em; color:var(--text-mute); font-weight:500; text-transform:uppercase; margin-top:1px; }

.nav-desktop{ display:flex; align-items:center; gap:2px; }
.nav-desktop a{ font-size:14px; font-weight:500; color:var(--text-soft); padding:9px 12px; border-radius:var(--radius-sm); white-space:nowrap; }
.nav-desktop a:hover{ background:var(--bg-dim); color:var(--text); }
.nav-desktop a.active{ color:var(--text); background:var(--bg-dim); }
.header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.header-actions .divider{ width:1px; height:22px; background:var(--line); margin:0 4px; }
.mobile-toggle{ display:none; }

@media (max-width:1080px){
  .nav-desktop{ display:none; }
  .mobile-toggle{ display:inline-flex; }
  .hide-mobile{ display:none !important; }
}

/* mobile drawer */
.mobile-drawer{ position:fixed; inset:0; z-index:90; display:none; }
.mobile-drawer.open{ display:block; }
.mobile-drawer .scrim{ position:absolute; inset:0; background:rgba(10,14,22,.5); }
.mobile-drawer .panel{
  position:absolute; top:0; right:0; height:100%; width:min(320px,86vw); background:var(--bg);
  border-left:1px solid var(--line); padding:var(--space-5); overflow-y:auto;
  display:flex; flex-direction:column; gap:var(--space-2);
  animation:slideIn .2s ease;
}
@keyframes slideIn{ from{ transform:translateX(24px); opacity:0;} to{ transform:translateX(0); opacity:1;} }
.mobile-drawer a.drawer-link{ display:flex; align-items:center; gap:10px; padding:12px 8px; font-size:15.5px; font-weight:500; border-bottom:1px solid var(--line-soft); }

/* bottom nav (mobile) */
.bottom-nav{ display:none; }
@media (max-width:720px){
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:70; background:var(--bg);
    border-top:1px solid var(--line); padding:6px var(--space-2) calc(env(safe-area-inset-bottom) + 6px);
    justify-content:space-around;
  }
  .bottom-nav a{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; color:var(--text-mute); font-weight:600; padding:4px 6px; }
  .bottom-nav a.active{ color:var(--gold); }
  body{ padding-bottom:64px; }
}

/* ---------- Footer ---------- */
.site-footer{ border-top:1px solid var(--line); background:var(--bg-dim); padding:var(--space-8) 0 var(--space-6); margin-top:var(--space-8); }
.footer-grid{ display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:var(--space-6); }
.footer-grid h5{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-mute); margin-bottom:var(--space-3); }
.footer-grid a{ display:block; padding:5px 0; font-size:14px; color:var(--text-soft); }
.footer-grid a:hover{ color:var(--text); }
.footer-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:var(--space-7); padding-top:var(--space-5); border-top:1px solid var(--line); font-size:13px; color:var(--text-mute); flex-wrap:wrap; gap:12px; }
@media (max-width:820px){ .footer-grid{ grid-template-columns:1fr 1fr; } }

/* ---------- Hero grid-paper texture ---------- */
.paper-grid{
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size:34px 34px;
}

/* ---------- Problem card (question / practice / test signature component) ---------- */
.problem-card{
  border:1px solid var(--line); border-left:3px solid var(--sc,var(--gold)); border-radius:var(--radius-md);
  background:var(--bg-raised); padding:var(--space-5); display:flex; flex-direction:column; gap:var(--space-3);
}
.problem-card .p-head{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); }
.problem-card .p-id{ font-family:var(--font-mono); font-size:12px; color:var(--text-mute); }
.problem-card .p-title{ font-size:16.5px; font-weight:600; line-height:1.4; }
.problem-card .p-meta{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12.5px; color:var(--text-mute); }
.problem-card .p-points{ font-family:var(--font-mono); font-size:12px; color:var(--gold-ink); background:var(--gold-soft); padding:2px 8px; border-radius:var(--radius-full); }

/* ---------- Stat strip / scoreboard (signature) ---------- */
.scoreboard{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; background:var(--bg-raised); }
.scoreboard .stat{ padding:var(--space-5) var(--space-4); border-right:1px solid var(--line-soft); }
.scoreboard .stat:last-child{ border-right:none; }
.scoreboard .stat .num{ font-family:var(--font-mono); font-size:26px; font-weight:600; letter-spacing:-0.01em; }
.scoreboard .stat .lbl{ font-size:12px; color:var(--text-mute); margin-top:4px; }
@media (max-width:720px){ .scoreboard{ grid-template-columns:repeat(2,1fr);} .scoreboard .stat:nth-child(2n){ border-right:none; } }

/* ---------- Forms ---------- */
.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:13px; font-weight:600; color:var(--text-soft); }
.field .hint{ font-size:12px; color:var(--text-mute); }
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[type=date],select,textarea{
  font-family:var(--font-body); font-size:14.5px; padding:11px 13px; border-radius:var(--radius-sm);
  border:1px solid var(--line); background:var(--bg); color:var(--text); width:100%;
}
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--cobalt); box-shadow:0 0 0 3px var(--cobalt-soft); }
textarea{ resize:vertical; min-height:110px; font-family:var(--font-body); }
.checkbox-row{ display:flex; align-items:center; gap:8px; font-size:14px; }

.select-pill{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius-full); border:1px solid var(--line); font-size:13px; font-weight:500; cursor:pointer; background:var(--bg-raised); color:var(--text-soft); }
.select-pill.active{ background:var(--text); color:var(--bg); border-color:var(--text); }
html[data-theme="dark"] .select-pill.active{ background:var(--gold); color:#141019; border-color:var(--gold); }
.pill-row{ display:flex; flex-wrap:wrap; gap:8px; }

/* ---------- Tabs ---------- */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); overflow-x:auto; }
.tab{ padding:11px 16px; font-size:14px; font-weight:600; color:var(--text-mute); border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer; }
.tab.active{ color:var(--text); border-color:var(--gold); }

/* ---------- Accordion ---------- */
.accordion-item{ border-bottom:1px solid var(--line); }
.accordion-trigger{ width:100%; text-align:left; background:none; border:none; padding:18px 4px; display:flex; justify-content:space-between; align-items:center; gap:16px; cursor:pointer; font-size:15.5px; font-weight:600; color:var(--text); }
.accordion-trigger .chev{ transition:transform .2s ease; flex-shrink:0; color:var(--text-mute); }
.accordion-item.open .chev{ transform:rotate(45deg); }
.accordion-panel{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
.accordion-item.open .accordion-panel{ max-height:600px; }
.accordion-panel-inner{ padding:0 4px 18px; color:var(--text-soft); font-size:14.5px; line-height:1.65; }

/* ---------- Progress ---------- */
.progress{ height:8px; border-radius:var(--radius-full); background:var(--bg-sunk); overflow:hidden; }
.progress > span{ display:block; height:100%; background:var(--gold); border-radius:var(--radius-full); transition:width .3s ease; }
.progress.cobalt > span{ background:var(--cobalt); }
.progress.success > span{ background:var(--success); }

/* ---------- Table ---------- */
.data-table{ width:100%; border-collapse:collapse; font-size:14px; }
.data-table th{ text-align:left; font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-mute); padding:10px 12px; border-bottom:1px solid var(--line); }
.data-table td{ padding:12px; border-bottom:1px solid var(--line-soft); }
.data-table tr:hover td{ background:var(--bg-dim); }

/* ---------- Toast ---------- */
.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px; }
@media (max-width:720px){ .toast-wrap{ bottom:76px; right:12px; left:12px; } }
.toast{ background:var(--text); color:var(--bg); padding:13px 18px; border-radius:var(--radius-sm); font-size:14px; font-weight:500; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:toastIn .18s ease; }
html[data-theme="dark"] .toast{ background:var(--bg-raised); border:1px solid var(--line); color:var(--text); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

/* ---------- Skeleton ---------- */
.skel{ background:linear-gradient(90deg,var(--bg-sunk) 25%,var(--bg-dim) 37%,var(--bg-sunk) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:var(--radius-sm); }
@keyframes skel{ 0%{ background-position:100% 50%;} 100%{ background-position:0 50%;} }

/* ---------- Empty / error state ---------- */
.empty-state{ text-align:center; padding:var(--space-8) var(--space-4); color:var(--text-mute); }
.empty-state .icon{ width:36px; height:36px; margin:0 auto var(--space-4); color:var(--text-mute); }
.empty-state h3{ color:var(--text); font-size:18px; margin-bottom:6px; }
.empty-state p{ font-size:14px; max-width:360px; margin:0 auto; }

/* ---------- Modal / drawer ---------- */
.modal-scrim{ position:fixed; inset:0; background:rgba(10,14,22,.5); z-index:150; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-scrim.open{ display:flex; }
.modal-box{ background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-lg); max-width:460px; width:100%; padding:var(--space-6); box-shadow:var(--shadow-lg); animation:modalIn .18s ease; }
@keyframes modalIn{ from{ opacity:0; transform:scale(.97) translateY(6px);} to{ opacity:1; transform:scale(1) translateY(0);} }

/* ---------- Avatar ---------- */
.avatar{ border-radius:50%; background:var(--cobalt-soft); color:var(--cobalt-ink); display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-mono); flex-shrink:0; }

/* ---------- Utility ---------- */
.flex{ display:flex; } .items-center{ align-items:center; } .justify-between{ justify-content:space-between; }
.gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;} .gap-5{gap:24px;}
.mt-2{margin-top:8px;} .mt-3{margin-top:12px;} .mt-4{margin-top:16px;} .mt-5{margin-top:24px;} .mt-6{margin-top:32px;} .mt-8{margin-top:64px;}
.mb-2{margin-bottom:8px;} .mb-3{margin-bottom:12px;} .mb-4{margin-bottom:16px;} .mb-5{margin-bottom:24px;}
.text-mute{ color:var(--text-mute); } .text-soft{ color:var(--text-soft); } .text-sm{ font-size:13px; } .text-xs{ font-size:11.5px; }
.font-mono{ font-family:var(--font-mono); }

  @media (max-width:960px){ .qd-layout{ grid-template-columns:1fr; } }
  .qd-stem{ font-size:16px; line-height:1.8; }
  .side-box{ position:sticky; top:calc(var(--header-h)+16px); border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--space-5); background:var(--bg-raised); }
  .side-box + .side-box{ margin-top:var(--space-4); }
  .concept-tag{ display:inline-block; font-size:12px; padding:5px 10px; border-radius:var(--radius-full); background:var(--cobalt-soft); color:var(--cobalt-ink); margin:0 6px 6px 0; }
  .reveal-box{ border:1px dashed var(--line); border-radius:var(--radius-md); padding:var(--space-4); background:var(--bg-dim); }
  #code-editor{ width:100%; min-height:220px; font-family:var(--font-mono); font-size:13px; background:#0B1119; color:#DCE3F0; border-radius:var(--radius-md); padding:16px; border:1px solid var(--line); tab-size:2; }
  .console-out{ font-family:var(--font-mono); font-size:12.5px; background:var(--bg-dim); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px; margin-top:10px; min-height:60px; white-space:pre-wrap; }
  .related-item{ display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13px; }
  .related-item:last-child{ border-bottom:none; }


/* --- questions --- */

  .q-layout{ display:grid; grid-template-columns:250px 1fr; gap:var(--space-6); align-items:flex-start; }
  @media (max-width:900px){ .q-layout{ grid-template-columns:1fr; } }
  .filter-box{ position:sticky; top:calc(var(--header-h) + 16px); border:1px solid var(--line); border-radius:var(--radius-md); padding:var(--space-4); background:var(--bg-raised); max-height:calc(100vh - 100px); overflow-y:auto; }
  .filter-group{ padding:var(--space-3) 0; border-bottom:1px solid var(--line-soft); }
  .filter-group:last-child{ border-bottom:none; }
  .filter-group h5{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-mute); margin-bottom:10px; }
  .filter-opt{ display:flex; align-items:center; gap:8px; font-size:13.5px; padding:5px 2px; cursor:pointer; color:var(--text-soft); }
  .filter-opt input{ accent-color:var(--gold); }
  .q-row{ padding:var(--space-4) var(--space-5); display:flex; align-items:center; gap:var(--space-4); }
  @media (max-width:640px){ .q-row{ flex-direction:column; align-items:flex-start; } }
  .q-row .q-main{ flex:1; }
  .q-row .q-title{ font-size:14.5px; font-weight:600; line-height:1.4; }
  .q-row .q-meta{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; font-size:12px; color:var(--text-mute); align-items:center; }
  .q-row .q-actions{ display:flex; gap:8px; flex-shrink:0; }
  .solved-badge{ font-family:var(--font-mono); font-size:11px; color:var(--text-mute); }


/* --- rankings --- */

  .rank-row{ display:flex; align-items:center; gap:16px; padding:14px var(--space-5); border-bottom:1px solid var(--line-soft); }
  .rank-row:last-child{ border-bottom:none; }
  .rank-num{ font-family:var(--font-mono); font-weight:700; width:28px; text-align:center; color:var(--text-mute); }
  .rank-row.top .rank-num{ color:var(--gold-ink); font-size:16px; }
  .rank-name{ flex:1; font-weight:600; font-size:14px; }
  .rank-flag{ font-size:11px; color:var(--text-mute); font-family:var(--font-mono); border:1px solid var(--line); border-radius:4px; padding:1px 6px; }


/* --- reset-password --- */

  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--space-6); }
  .auth-box{ width:100%; max-width:400px; }
  .auth-box .brand{ justify-content:center; margin-bottom:var(--space-6); }


/* --- resource-detail --- */

  .rd-layout{ display:grid; grid-template-columns:1fr 300px; gap:var(--space-6); align-items:flex-start; }
  @media (max-width:900px){ .rd-layout{ grid-template-columns:1fr; } }
  .preview-page{ aspect-ratio:8.5/11; background:var(--bg-dim); border:1px solid var(--line); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; color:var(--text-mute); }


/* --- resources --- */

  .res-card{ padding:var(--space-5); display:flex; flex-direction:column; gap:10px; }
  .res-icon{ width:38px; height:38px; border-radius:10px; background:var(--cobalt-soft); color:var(--cobalt-ink); display:flex; align-items:center; justify-content:center; }
  .res-card h4{ font-size:15px; line-height:1.4; }
  .res-card p{ font-size:13px; color:var(--text-mute); line-height:1.55; flex:1; }


/* --- roadmap-detail --- */

  .milestone{ display:flex; gap:16px; padding:18px 0; border-bottom:1px solid var(--line-soft); }
  .milestone:last-child{ border-bottom:none; }
  .m-check{ width:26px; height:26px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; color:transparent; }
  .m-check.done{ background:var(--success); border-color:var(--success); color:#fff; }
  .m-title{ font-weight:600; font-size:15px; }
  .m-title.done{ text-decoration:line-through; color:var(--text-mute); }


/* --- roadmaps --- */

  .rm-card{ padding:var(--space-5); display:flex; flex-direction:column; gap:12px; }
  .rm-card h3{ font-size:17px; }
  .rm-card p{ font-size:13.5px; color:var(--text-mute); line-height:1.6; flex:1; }
  .rm-milestones{ display:flex; flex-direction:column; gap:6px; }
  .rm-milestones div{ font-size:12px; color:var(--text-mute); display:flex; gap:8px; align-items:center; }
  .rm-milestones div::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--line); flex-shrink:0; }


/* --- settings --- */

  .settings-layout{ display:grid; grid-template-columns:220px 1fr; gap:var(--space-6); align-items:flex-start; }
  @media (max-width:820px){ .settings-layout{ grid-template-columns:1fr; } }
  .settings-nav a{ display:block; padding:10px 12px; border-radius:8px; font-size:14px; color:var(--text-soft); }
  .settings-nav a.active{ background:var(--bg-dim); color:var(--text); font-weight:600; }
  .settings-panel{ display:none; }
  .settings-panel.active{ display:block; }


/* --- signup --- */

  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--space-6); }
  .wizard-box{ width:100%; max-width:520px; }
  .wizard-box .brand{ justify-content:center; margin-bottom:var(--space-5); }
  .wizard-steps{ display:flex; gap:6px; margin-bottom:var(--space-6); }
  .wizard-steps span{ flex:1; height:4px; border-radius:2px; background:var(--bg-sunk); }
  .wizard-steps span.done{ background:var(--gold); }
  .wiz-panel{ display:none; }
  .wiz-panel.active{ display:block; animation:fadeUp .3s ease; }
  .choice-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:var(--space-4); }
  .choice{ border:1px solid var(--line); border-radius:10px; padding:13px 14px; font-size:13.5px; cursor:pointer; text-align:center; }
  .choice.active{ border-color:var(--gold); background:var(--gold-soft); color:var(--gold-ink); font-weight:600; }
  .wiz-nav{ display:flex; justify-content:space-between; margin-top:var(--space-6); }


/* --- subjects --- */

  .subj-full{ padding:var(--space-5); scroll-margin-top:90px; }
  .subj-full .top{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; justify-content:space-between; }
  .subj-full .s-icon{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--c) 14%, transparent); color:var(--c); flex-shrink:0; }
  .topic-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:var(--space-4); }
  .topic-tag{ font-size:12.5px; padding:6px 12px; border-radius:var(--radius-full); border:1px solid var(--line); color:var(--text-soft); }
  .subj-stats-row{ display:flex; gap:var(--space-6); margin-top:var(--space-4); }
  .subj-stats-row .n{ font-family:var(--font-mono); font-weight:600; font-size:18px; }
  .subj-stats-row .l{ font-size:11.5px; color:var(--text-mute); }


/* --- terms --- */

  .legal-body{ max-width:720px; }
  .legal-body h2{ font-size:19px; margin:32px 0 12px; }
  .legal-body p, .legal-body li{ font-size:14.5px; color:var(--text-soft); line-height:1.75; margin-bottom:12px; }
  .legal-body ul{ padding-left:20px; list-style:disc; }
  .legal-nav{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:var(--space-6); }


/* --- test-builder --- */

  .tb-layout{ display:grid; grid-template-columns:1fr 340px; gap:var(--space-6); align-items:flex-start; }
  @media (max-width:960px){ .tb-layout{ grid-template-columns:1fr; } }
  .tb-section{ border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--space-5); background:var(--bg-raised); }
  .tb-section + .tb-section{ margin-top:var(--space-5); }
  .tb-section h4{ font-size:15px; margin-bottom:14px; }
  .preview-box{ position:sticky; top:calc(var(--header-h) + 16px); border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--space-5); background:var(--bg-raised); }
  .preview-stat{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; }
  .dist-bar{ display:flex; height:10px; border-radius:6px; overflow:hidden; margin-top:8px; }
  .dist-bar span{ height:100%; }


/* --- test-results --- */

  .result-hero{ text-align:center; padding:var(--space-7) 0; }
  .score-ring{ width:140px; height:140px; margin:0 auto; position:relative; }
  .score-ring .n{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .score-ring .n b{ font-family:var(--font-mono); font-size:30px; }
  .score-ring .n span{ font-size:11px; color:var(--text-mute); }
  .breakdown-row{ display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--line-soft); }
  .breakdown-row .lbl{ width:150px; font-size:13px; flex-shrink:0; }
  .qrow{ display:flex; align-items:center; gap:14px; padding:13px var(--space-4); border-bottom:1px solid var(--line-soft); }
  .qrow:last-child{ border-bottom:none; }
  .qrow .mark{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .qrow .mark.correct{ background:var(--success-soft); color:var(--success); }
  .qrow .mark.incorrect{ background:var(--danger-soft); color:var(--danger); }


/* --- test-session --- */

 
  .ts-bar{ position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 0; }
  .ts-bar .container{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); }
  .ts-layout{ display:grid; grid-template-columns:1fr 260px; gap:var(--space-6); align-items:flex-start; padding:var(--space-6) var(--space-5); max-width:1240px; margin:0 auto; }
  @media (max-width:900px){ .ts-layout{ grid-template-columns:1fr; } }
  .ts-card{ background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--space-6); }
  .qnav{ position:sticky; top:calc(var(--header-h) + 16px); border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--space-4); background:var(--bg-raised); }
  .qnav-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px; }
  .qnav-cell{ aspect-ratio:1; border-radius:6px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; cursor:pointer; background:var(--bg); }
  .qnav-cell.answered{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
  .qnav-cell.review{ background:var(--warn-soft); border-color:var(--warn); color:var(--warn); }
  .qnav-cell.current{ outline:2px solid var(--cobalt); }
  .legend{ display:flex; flex-direction:column; gap:6px; margin-top:14px; font-size:11.5px; color:var(--text-mute); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }



/* ---------- SPA shell / router ---------- */
#app-root{ min-height:60vh; }
body.shell-dim{ background:var(--bg-dim); }
[data-route], [data-scroll-to]{ cursor:pointer; }

</style>
</head>
<body>
<div id="site-header" class="site-header"></div>
<div id="app-root"></div>
<div id="site-footer" class="site-footer"></div>

<template id="tpl-about">
<main>
  <section class="page-hero about-hero">
    <div class="container">
      <div class="breadcrumb"><a data-route="index" role="link" tabindex="0">Home</a><span>/</span><span>About</span></div>
      <div class="eyebrow mt-3">Our mission</div>
      <h1 class="section-title mt-2">Preparation shouldn't depend on which forum you happened to find first.</h1>
      <p class="mt-4">School of Olympiad exists because STEM competition preparation is currently scattered across dozens of disconnected sites, PDFs and forums — while the students who need it most often don't even know where to start. We built one system: one question bank, one dashboard, one recommendation engine, covering nine disciplines and dozens of competitions.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head"><div><div class="eyebrow">Why we exist</div><h2 class="section-title">Vision</h2></div></div>
      <p class="section-sub" style="max-width:720px;">We want any student, anywhere, with an internet connection, to be able to find their competition, understand exactly what it requires, and follow a structured, data-informed path toward it — without needing an expensive coach or a well-connected school to get started.</p>
    </div>
  </section>

  <section class="section" style="background:var(--bg-dim); border-top:1px solid var(--line); border-bottom:1px solid var(--line);">
    <div class="container">
      <div class="section-head"><div><div class="eyebrow">How we work</div><h2 class="section-title">How content is curated</h2></div></div>
      <div class="grid grid-3">
        <div class="card value-card"><h4>Editorial review</h4><p>Every question, article and resource passes editorial review before publishing, checked for accuracy and appropriate sourcing.</p></div>
        <div class="card value-card"><h4>Community reporting</h4><p>Students can flag any question for review directly from its page — issues are triaged and corrected quickly.</p></div>
        <div class="card value-card"><h4>Proper attribution</h4><p>Past-competition problems are clearly labeled by competition and year rather than presented as original content.</p></div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head"><div><div class="eyebrow">People</div><h2 class="section-title">Community &amp; contributors</h2></div></div>
      <div class="card" style="padding:var(--space-5);">
        <div class="contrib-row"><span class="avatar" style="width:36px;height:36px;font-size:12px;">ET</span><div><div style="font-weight:600; font-size:14px;">Editorial Team</div><div class="text-mute text-xs">Question review, article writing, competition data curation</div></div></div>
        <div class="contrib-row"><span class="avatar" style="width:36px;height:36px;font-size:12px;">CN</span><div><div style="font-weight:600; font-size:14px;">Community Contributors</div><div class="text-mute text-xs">Student and alumni volunteers helping expand the question bank</div></div></div>
        <div class="contrib-row" style="border-bottom:none;"><span class="avatar" style="width:36px;height:36px;font-size:12px;">SR</span><div><div style="font-weight:600; font-size:14px;">Subject Reviewers</div><div class="text-mute text-xs">Former olympiad medalists and coaches reviewing difficulty and accuracy</div></div></div>
      </div>
    </div>
  </section>

  <section class="section" style="background:var(--bg-dim); border-top:1px solid var(--line);">
    <div class="container text-center">
      <h2 class="section-title">Questions, feedback, or want to contribute?</h2>
      <a data-route="contact" role="link" tabindex="0" class="btn btn-gold btn-lg mt-5">Get in touch</a>
    </div>
  </section>
</main>
</template>
<template id="tpl-achievements">
<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a data-route="index" role="link" tabindex="0">Home</a><span>/</span><span>Achievements</span></div>
      <div class="eyebrow mt-3">Recognition</div>

<template id="tpl-admin">
<div class="admin-shell">
  <aside class="admin-side">
    <a data-route="index" role="link" tabindex="0" class="brand" style="margin-bottom:var(--space-5);"><svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26"><circle cx="16" cy="16" r="10.5" fill="none" stroke="var(--gold)" stroke-width="1.6"/><circle cx="16" cy="5.3" r="2" fill="var(--gold)"/><path d="M11 16.6l3.3 3.3 6.6-7.4" fill="none" stroke="var(--cobalt)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="font-size:15px;">Admin</span></a>
    <a data-p="analytics" class="active">Analytics</a>
    <a data-p="questions">Questions</a>
    <a data-p="competitions">Competitions</a>
    <a data-p="subjects">Subjects</a>
    <a data-p="articles">Articles</a>
    <a data-p="resources">Resources</a>
    <a data-p="users">Users</a>
    <hr class="divider-h">
    <a data-route="index" role="link" tabindex="0">← Back to site</a>
  </aside>

  <div class="admin-main">
    <!-- ANALYTICS -->
    <div class="admin-panel active" data-panel="analytics">
      <h2 style="font-size:22px;" class="mb-5">Platform analytics</h2>
      <div class="grid grid-4 mb-6">
        <div class="stat-mini"><div class="n">48,200</div><div class="l">Active students</div></div>
        <div class="stat-mini"><div class="n">11,065</div><div class="l">Total questions</div></div>
        <div class="stat-mini"><div class="n">312</div><div class="l">Practice sets</div></div>
        <div class="stat-mini"><div class="n">89%</div><div class="l">Avg question success rate</div></div>
      </div>
      <div class="grid grid-2">
        <div class="card chart-card" style="padding:var(--space-5);"><h4 style="font-size:14px;" class="mb-3">Most practiced subjects</h4><canvas id="chart-admin-subj"></canvas></div>
        <div class="card chart-card" style="padding:var(--space-5);"><h4 style="font-size:14px;" class="mb-3">Weekly active users</h4><canvas id="chart-admin-users"></canvas></div>
      </div>
      <div class="card mt-5" style="padding:var(--space-5);">
        <h4 style="font-size:14px;" class="mb-3">Most popular competitions (by practice volume)</h4>
        <table class="data-table"><thead><tr><th>Competition</th><th>Subject</th><th>Practice sessions</th><th>Avg score</th></tr></thead>
        <tbody id="pop-comps"></tbody></table>
      </div>
    </div>

    <!-- QUESTIONS -->
    <div class="admin-panel" data-panel="questions">
      <div class="admin-toolbar"><h2 style="font-size:22px;">Questions</h2><button class="btn btn-gold btn-sm" id="add-question">+ New question</button></div>
      <table class="data-table"><thead><tr><th>ID</th><th>Title</th><th>Subject</th><th>Difficulty</th><th>Type</th><th></th></tr></thead>
      <tbody id="q-table"></tbody></table>
    </div>

    <!-- COMPETITIONS -->
    <div class="admin-panel" data-panel="competitions">
      <div class="admin-toolbar"><h2 style="font-size:22px;">Competitions</h2><button class="btn btn-gold btn-sm" id="add-comp">+ New competition</button></div>
      <table class="data-table"><thead><tr><th>Name</th><th>Subject</th><th>Type</th><th>Country</th><th>Editions</th><th></th></tr></thead>
      <tbody id="c-table"></tbody></table>
    </div>

    <!-- SUBJECTS -->
    <div class="admin-panel" data-panel="subjects">
      <div class="admin-toolbar"><h2 style="font-size:22px;">Subjects</h2><button class="btn btn-gold btn-sm" id="add-subject">+ New subject</button></div>
      <table class="data-table"><thead><tr><th>Subject</th><th>Topics</th><th>Questions</th><th>Competitions</th><th></th></tr></thead>
      <tbody id="s-table"></tbody></table>
    </div>

    <!-- ARTICLES -->
    <div class="admin-panel" data-panel="articles">
      <div class="admin-toolbar"><h2 style="font-size:22px;">Articles</h2><button class="btn btn-gold btn-sm" id="add-article">+ Draft article</button></div>
      <table class="data-table"><thead><tr><th>Title</th><th>Category</th><th>Author</th><th>Status</th><th></th></tr></thead>
      <tbody id="a-table"></tbody></table>
    </div>

    <!-- RESOURCES -->
    <div class="admin-panel" data-panel="resources">
      <div class="admin-toolbar"><h2 style="font-size:22px;">Resources</h2><button class="btn btn-gold btn-sm" id="add-resource">+ Upload resource</button></div>
      <table class="data-table"><thead><tr><th>Title</th><th>Type</th><th>Subject</th><th>Status</th><th></th></tr></thead>
      <tbody id="r-table"></tbody></table>
    </div>

    <!-- USERS -->
    <div class="admin-panel" data-panel="users">
      <div class="admin-toolbar"><h2 style="font-size:22px;">Users</h2>
        <div class="flex items-center gap-3" style="border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--bg-raised);">
          <svg class="icon text-mute" viewBox="0 0 24 24" style="width:15px;height:15px;"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" placeholder="Search users…" style="border:none; padding:0; width:180px;">

const SOO_ARTICLES = [
  { slug:"why-timed-practice-matters", title:"Why Timed Practice Changes How You Solve", subject:"mathematics", category:"Exam Strategy", author:"Editorial Team", date:"2026-06-02", readTime:6,
    excerpt:"Working without a clock teaches you to solve problems. Working against one teaches you to finish them — here's how to build that muscle deliberately.",
    body:["Most students first learn a subject untimed: read, think, retry, look things up. That's the right way to build understanding. But an olympiad exam rewards a second, different skill — deciding quickly which of six problems to attack first, and when to abandon a dead end.","Timed practice exposes a gap that untimed practice hides. You may be able to solve a problem in twenty minutes with no pressure, then freeze completely with a clock running. The fix isn't to grind more untimed problems — it's to practice the specific skill of triage under a visible timer, on problems slightly below your ceiling difficulty.","Start with sessions half the length of the real exam, using problems you've mostly seen the topic of. Gradually increase both the difficulty and the fraction of unfamiliar problems as your triage instinct improves."] },
  { slug:"structuring-a-90-day-plan", title:"Structuring a 90-Day Olympiad Preparation Plan", subject:"mathematics", category:"Olympiad Strategy", author:"Editorial Team", date:"2026-05-18", readTime:8,
    excerpt:"Ninety days is enough time to move a full difficulty tier if the plan has three distinct phases instead of one long grind.",
    body:["A common mistake is treating 90 days as one undifferentiated block of practice. It works far better as three phases: a diagnostic and foundations phase (roughly 3 weeks), a topic-depth phase (roughly 6 weeks), and a simulation phase (the final 3 weeks).","In the foundations phase, take one full mock exam cold to identify your weakest two or three topics — resist the urge to skip this because it feels discouraging. The topic-depth phase should allocate roughly 60% of practice time to those weak areas while maintaining light contact with your strengths.","The final simulation phase should almost entirely consist of full timed mock exams under real conditions, with careful post-mortems rather than new content."] },
  { slug:"reading-a-physics-problem", title:"How to Read a Physics Problem Before Solving It", subject:"physics", category:"Problem Solving", author:"Editorial Team", date:"2026-04-30", readTime:5,
    excerpt:"The highest-leverage sixty seconds of any physics problem happen before you write a single equation.",
    body:["Strong problem solvers spend the first minute doing something that looks like nothing: identifying the system, listing what's conserved, and sketching the geometry. Weaker solvers start writing equations from the first sentence, which often locks them into the wrong frame.","Before touching algebra, ask three questions: what quantity is conserved or changing steadily, what does the geometry force to be true, and what limiting case would make the answer obvious. That third question — the limiting case — is one of the most underused checks in physics olympiad problem solving.","Once you have answers to those three questions, the equations you need are usually obvious, and you write far fewer wrong ones."] },
  { slug:"organic-mechanism-patterns", title:"Six Mechanism Patterns That Cover Most Organic Chemistry Problems", subject:"chemistry", category:"Concepts", author:"Editorial Team", date:"2026-04-12", readTime:9,
    excerpt:"Organic chemistry looks infinite until you notice that most olympiad mechanisms are variations on a small number of patterns.",
    body:["Students often treat every organic mechanism as a new thing to memorise. In practice, the overwhelming majority of olympiad-level mechanism questions draw from six recurring patterns: nucleophilic substitution, elimination, electrophilic addition, nucleophilic addition to carbonyls, electrophilic aromatic substitution, and radical chain reactions.","Rather than memorising hundreds of individual reactions, build a one-page reference for each pattern: what makes a good nucleophile or electrophile in that context, what the rate-determining step looks like, and what stereochemical outcome to expect.","When you hit an unfamiliar reaction on an exam, the fastest path to a partial-credit answer is asking which of the six patterns it most resembles, then adapting from there."] },
  { slug:"genetics-crosses-fast", title:"Solving Genetics Crosses Fast Under Time Pressure", subject:"biology", category:"Problem Solving", author:"Editorial Team", date:"2026-03-22", readTime:7,
    excerpt:"Punnett squares work, but they're slow. Here's the shortcut notation top biology olympiad students actually use in-exam.",
    body:["A full Punnett square for a trihybrid cross has 64 cells — nobody draws that under time pressure. Instead, treat each gene independently using the product rule, then multiply probabilities for the specific genotype or phenotype combination you need.","For linked genes, skip the square entirely and reason directly from recombination frequency: a gene pair 12 map units apart produces 12% recombinant gametes, split evenly between the two recombinant classes.","Practicing this notation on twenty short problems is far more valuable before an exam than working three enormous multi-gene Punnett squares by hand."] },
  { slug:"competitive-programming-io", title:"The Most Common IO-Handling Mistakes in Competitive Programming", subject:"computer-science", category:"Programming", author:"Editorial Team", date:"2026-03-05", readTime:6,
    excerpt:"A correct algorithm with a broken input parser still scores zero. Here's what trips up strong programmers under contest pressure.",
    body:["Judges are unforgiving about format. The single most common cause of an unexpected wrong-answer verdict on an otherwise-correct solution is mishandling input format edge cases — trailing whitespace, multiple test cases per file, or unspecified upper bounds on array size.","Before writing any algorithm, write and test your input parser against the exact sample input, including boundary cases like n = 0 or n = 1 explicitly, even if the problem statement seems to imply they won't occur.","Keep a small personal library of tested IO templates for your language of choice — fast IO for C++, buffered readers for Python — and reuse them rather than rewriting boilerplate under time pressure."] },
  { slug:"observational-astronomy-basics", title:"What to Actually Practice for Observational Astronomy Rounds", subject:"astronomy", category:"Exam Strategy", author:"Editorial Team", date:"2026-02-14", readTime:6,
    excerpt:"Observational rounds reward specific, practiced skills — not general astronomy knowledge.",
    body:["Observational astronomy rounds surprise students who prepared only theory, because the skills tested are narrow and mechanical: star-hopping with a planisphere, estimating angular separation by eye, and reading a telescope's setting circles quickly and accurately.","The highest-leverage practice is repetition with real or simulated star charts under a time limit, not additional theoretical reading. Aim to identify twenty bright reference stars and their approximate coordinates from memory.","Practice converting between altitude-azimuth and equatorial coordinates by hand at least until it's automatic — this single skill recovers the most points under exam time pressure."] },
  { slug:"reading-a-weather-map", title:"Reading a Synoptic Weather Map Like an Earth Science Olympiad Judge", subject:"earth-science", category:"Concepts", author:"Editorial Team", date:"2026-01-27", readTime:5,
    excerpt:"A synoptic chart looks dense until you know the four things a judge actually wants you to identify first.",
    body:["Faced with a synoptic weather chart for the first time, most students try to read every isobar and front simultaneously. Judges are usually testing four specific skills: locating pressure systems, identifying front types, estimating wind direction from isobar spacing, and predicting near-term weather change.","Work the chart in that fixed order every time, rather than jumping around. Locate highs and lows first, then trace fronts, then infer wind direction using the geostrophic approximation, and only then attempt a forecast statement.","This fixed sequence turns a dense, intimidating chart into a five-minute mechanical exercise instead of an open-ended reading task."] },
];

/* ---------- Theme ---------- */
function initTheme(){
  const root = document.documentElement;
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  updateThemeIcon();
  document.addEventListener('click', (e)=>{
    if(e.target.closest('#btn-theme')){
      const cur = root.getAttribute('data-theme');
      root.setAttribute('data-theme', cur==='dark' ? 'light' : 'dark');
      updateThemeIcon();
    }
  });
}
function updateThemeIcon(){
  const btn = document.getElementById('btn-theme');
  if(!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  btn.innerHTML = icon(isDark ? 'sun' : 'moon');
}

/* ---------- Toast ---------- */
function sooToast(msg, iconName){
  let wrap = document.querySelector('.toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${icon(iconName||'check')}<span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .25s ease'; setTimeout(()=>t.remove(),260); }, 2600);
}

/* ---------- Global search overlay ---------- */
function openSearchOverlay(){
  let scrim = document.getElementById('search-scrim');
  if(scrim){ scrim.classList.add('open'); scrim.querySelector('input').focus(); return; }
  scrim = document.createElement('div');
  scrim.className = 'modal-scrim open';
  scrim.id = 'search-scrim';
  scrim.innerHTML = `<div class="modal-box" style="max-width:600px; text-align:left;">
    <div class="flex items-center gap-3" style="border:1px solid var(--line); border-radius:10px; padding:10px 14px;">
      ${icon('search','text-mute')}
      <input type="search" id="global-search-input" placeholder="Search questions, competitions, subjects, articles…" style="border:none; padding:4px 0;">
      <button class="btn-icon" id="search-close">${icon('x')}</button>
    </div>
    <div id="search-results" class="mt-4" style="max-height:360px; overflow-y:auto;"></div>
  </div>`;
  document.body.appendChild(scrim);
  scrim.addEventListener('click', e=>{ if(e.target===scrim) scrim.classList.remove('open'); });
  scrim.querySelector('#search-close').addEventListener('click',()=>scrim.classList.remove('open'));
  scrim.querySelector('#global-search-input').addEventListener('input', e=>runGlobalSearch(e.target.value));
  runGlobalSearch('');
  setTimeout(()=>scrim.querySelector('input').focus(),50);
}
function runGlobalSearch(q){
  const res = document.getElementById('search-results');
  if(!res) return;
  q = (q||'').trim().toLowerCase();
  if(!q){ res.innerHTML = `<p class="text-mute text-sm">Try “thermodynamics”, “IMO”, or “genetics”.</p>`; return; }
  const hits = [];
  SOO.subjects.filter(s=>s.name.toLowerCase().includes(q)).forEach(s=>hits.push({type:'Subject',label:s.name,href:`subjects.html?anchor=${s.slug}`}));
  SOO.competitions.filter(c=>c.name.toLowerCase().includes(q)||c.short.toLowerCase().includes(q)).forEach(c=>hits.push({type:'Competition',label:c.name,href:`competition-detail.html?slug=${c.slug}`}));
  SOO.questions.filter(q2=>q2.title.toLowerCase().includes(q)||q2.topic.toLowerCase().includes(q)).forEach(q2=>hits.push({type:'Question',label:q2.title,href:`question-detail.html?id=${q2.id}`}));
  SOO.articles.filter(a=>a.title.toLowerCase().includes(q)).forEach(a=>hits.push({type:'Article',label:a.title,href:`article-detail.html?slug=${a.slug}`}));
  SOO.resources.filter(r=>r.title.toLowerCase().includes(q)).forEach(r=>hits.push({type:'Resource',label:r.title,href:`resource-detail.html?slug=${r.slug}`}));
  if(!hits.length){ res.innerHTML = `<p class="text-mute text-sm">No results for “${q}”. Try a different term.</p>`; return; }
  res.innerHTML = hits.slice(0,10).map(h=>`<a data-route="${h.href}" role="link" tabindex="0" class="flex items-center justify-between" style="padding:11px 6px; border-bottom:1px solid var(--line-soft);">
    <span class="text-sm">${h.label}</span><span class="badge">${h.type}</span></a>`).join('');
}

/* ---------- Helpers ---------- */
function qs(name){ return (window.__routeQuery || new URLSearchParams()).get(name); }
function initAccordions(root){
  (root||document).querySelectorAll('.accordion-trigger').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.parentElement.classList.toggle('open');
    });
  });
}
function initTabs(root, onChange){
  (root||document).querySelectorAll('.tabs').forEach(tabbar=>{
    tabbar.querySelectorAll('.tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        tabbar.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        if(onChange) onChange(tab.dataset.tab, tabbar);
      });
    });
  });
}
function animateCount(el, target, suffix){
  const dur = 900; const start = performance.now();
  function step(t){
    const p = Math.min(1,(t-start)/dur);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = Math.round(eased*target).toLocaleString() + (suffix||'');
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

}

  'competitions': { chrome:true, dimBg:false, init:function(){

  categories.map(c=>`<label class="filter-opt"><input type="checkbox" class="f-cat" value="${c}"> ${c}</label>`).join('');

if(params.get('subject')){
  document.querySelectorAll('.f-subj').forEach(cb=>cb.checked = cb.value===params.get('subject'));
}

function render(){
  const q = document.getElementById('comp-search').value.trim().toLowerCase();
  const type = document.querySelector('input[name=type]:checked').value;
  const formats = [...document.querySelectorAll('.filter-group input[type=checkbox]')].filter(c=>['Individual','Team','Individual/Team'].includes(c.value) && c.checked).map(c=>c.value);
  const subjChecked = [...document.querySelectorAll('.f-subj')].filter(c=>c.checked).map(c=>c.value);
  const catChecked = [...document.querySelectorAll('.f-cat')].filter(c=>c.checked).map(c=>c.value);
  const onlineOnly = document.getElementById('f-online').checked;
  const sortBy = document.getElementById('sort-by').value;

  let list = SOO.competitions.filter(c=>{
    if(q && !(c.name.toLowerCase().includes(q) || c.short.toLowerCase().includes(q) || c.country.toLowerCase().includes(q))) return false;
    if(type!=='all' && c.type!==type) return false;
    if(!formats.includes(c.format)) return false;
    if(!subjChecked.includes('all') && !subjChecked.includes(c.subject)) return false;
    if(!catChecked.includes('all') && !catChecked.includes(c.category)) return false;
    if(onlineOnly && !c.online) return false;
    return true;
  });
  if(sortBy==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  if(sortBy==='difficulty') list.sort((a,b)=>b.difficulty-a.difficulty);
  if(sortBy==='editions') list.sort((a,b)=>b.editions-a.editions);

  document.getElementById('result-count').textContent = `${list.length} competition${list.length===1?'':'s'}`;
  document.getElementById('comp-empty').classList.toggle('hidden', list.length>0);
  document.getElementById('comp-grid').innerHTML = list.map(c=>{
    const sub = SOO.subject(c.subject);
    return `<a data-route="competition-detail?slug=${c.slug}" role="link" tabindex="0" class="card card-hover grid-card">
      <div class="top"><div class="mark" style="color:${sub.color};">${c.short}</div><span class="badge">${c.type}</span></div>
      <h3>${c.name}</h3>
      <p class="desc">${c.desc}</p>
      <div class="meta-row">
        <span class="subject-chip sc-${sub.slug}">${sub.name}</span>
        <span class="badge">${c.format}</span>
        <span class="badge">${c.country}</span>
      </div>
      <div class="flex justify-between items-center text-xs text-mute">
        <span>${c.months}</span>
        <span class="diff-dots">${[1,2,3,4,5].map(i=>`<i class="${i<=c.difficulty?'on':''}"></i>`).join('')}</span>
      </div>
    </a>`;
  }).join('');
}

document.getElementById('comp-search').addEventListener('input', render);
document.querySelectorAll('input[name=type]').forEach(r=>r.addEventListener('change', render));
document.querySelectorAll('.filter-group input[type=checkbox]').forEach(c=>c.addEventListener('change', ()=>{
  if(c.classList.contains('f-subj') && c.value==='all' && c.checked) document.querySelectorAll('.f-subj').forEach(x=>{if(x.value!=='all')x.checked=false;});
  else if(c.classList.contains('f-subj') && c.value!=='all' && c.checked) document.querySelector('.f-subj[value=all]').checked=false;
  if(c.classList.contains('f-cat') && c.value==='all' && c.checked) document.querySelectorAll('.f-cat').forEach(x=>{if(x.value!=='all')x.checked=false;});
  else if(c.classList.contains('f-cat') && c.value!=='all' && c.checked) document.querySelector('.f-cat[value=all]').checked=false;
  render();
}));
document.getElementById('sort-by').addEventListener('change', render);
document.getElementById('reset-filters').addEventListener('click', ()=>{
  document.getElementById('comp-search').value='';
  document.querySelector('input[name=type][value=all]').checked=true;
  document.querySelectorAll('.filter-group input[type=checkbox]').forEach(c=>{ c.checked = c.value==='all' || ['Individual','Team','Individual/Team'].includes(c.value); });
  document.getElementById('f-online').checked=false;
  render();
});
render();

  'practice-session': { chrome:false, dimBg:true, init:function(){

document.querySelector('a[aria-label="Exit session"]').innerHTML = icon('x');
document.getElementById('ps-timer').innerHTML = icon('timer') + ' <span id="timer-txt">00:00</span>';
['tool-bookmark','tool-hint','tool-calc','tool-notes','tool-report'].forEach((id,i)=>{
  const names=['bookmark','eye','cpu','edit','flag'];
  document.getElementById(id).innerHTML = icon(names[i]);
});

const mode = qs('mode') || 'quick';
const subjectFilter = qs('subject');
let pool = subjectFilter ? SOO.questionsBySubject(subjectFilter) : SOO.questions.slice();
pool = pool.sort(()=>Math.random()-0.5).slice(0,8);
if(pool.length < 1) pool = SOO.questions.slice(0,8);

let idx = 0, correctCount = 0, elapsed = 0, answered = false;
const timerInterval = trackInterval(setInterval(()=>{ elapsed++; const m=String(Math.floor(elapsed/60)).padStart(2,'0'); const s=String(elapsed%60).padStart(2,'0'); document.getElementById('timer-txt').textContent = `${m}:${s}`; }, 1000));

function showStage(name){
  document.querySelectorAll('.ps-stage').forEach(s=>s.classList.remove('active'));
  document.getElementById('stage-'+name).classList.add('active');
}

function loadQuestion(){
  answered = false;
  const item = pool[idx];
  const sub = SOO.subject(item.subject);
  document.getElementById('ps-count').textContent = `Question ${idx+1} of ${pool.length}`;
  document.getElementById('ps-subject').textContent = sub.name + ' · ' + SOO.difficultyLabel(item.difficulty);
  document.getElementById('ps-progress-bar').style.width = (idx/pool.length*100)+'%';
  document.getElementById('ps-card').style.setProperty('--sc', sub.color);
  document.getElementById('ps-id').textContent = item.id;
  document.getElementById('ps-points').textContent = item.points+' pts';
  document.getElementById('ps-stem').innerHTML = item.stem;
  document.getElementById('ps-hint-box').classList.add('hidden');

  const area = document.getElementById('ps-answer');
  if(item.type==='Multiple Choice' || item.type==='Multiple Select'){
    const opts = ['Option A','Option B','Option C','Option D'];
    const inputType = item.type==='Multiple Select' ? 'checkbox':'radio';
    area.innerHTML = opts.map((o,i)=>`<label class="filter-opt" style="border:1px solid var(--line); border-radius:8px; padding:11px 13px; margin-bottom:8px; font-size:14px;"><input type="${inputType}" name="ps-mcq" value="${i}"> ${o}</label>`).join('');
  } else {
    area.innerHTML = `<div class="field"><label>Your answer</label><input type="text" placeholder="Type your answer…"></div>`;
  }
  showStage('question');
  if(window.renderMathInElement) renderMathInElement(document.getElementById('ps-card'), {delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}]});
}

document.getElementById('tool-hint').addEventListener('click', ()=>{
  const box = document.getElementById('ps-hint-box');
  box.classList.remove('hidden');
  box.innerHTML = `<strong style="font-size:13px;">Hint —</strong> ${pool[idx].hint}`;
  if(window.renderMathInElement) renderMathInElement(box, {delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}]});
});
document.getElementById('tool-bookmark').addEventListener('click', e=>{ e.currentTarget.style.color='var(--gold)'; sooToast('Bookmarked','bookmark'); });
document.getElementById('tool-calc').addEventListener('click', ()=>sooToast('Calculator opened','cpu'));
document.getElementById('tool-notes').addEventListener('click', ()=>sooToast('Note panel opened','edit'));
document.getElementById('tool-report').addEventListener('click', ()=>sooToast('Issue reported','flag'));
document.getElementById('btn-prev').addEventListener('click', ()=>{ if(idx>0){ idx--; loadQuestion(); } });

document.getElementById('btn-submit').addEventListener('click', ()=>{
  if(answered) return;
  answered = true;
  const item = pool[idx];
  const correct = Math.random() > 0.3;
  if(correct) correctCount++;
  const card = document.getElementById('feedback-card');
  card.style.setProperty('--sc', SOO.subject(item.subject).color);
  card.innerHTML = `
    <div class="badge ${correct?'badge-success':'badge-danger'}" style="padding:9px 14px; font-size:13px;">${correct?'Correct':'Incorrect'}</div>
    <h3 style="font-size:17px; margin-top:14px;">Explanation</h3>
    <p style="font-size:14.5px; line-height:1.7; margin-top:8px;" id="fb-solution">${item.solution}</p>
    <div class="flex gap-2 flex-wrap mt-4">${item.concepts.map(c=>`<span class="concept-tag" style="background:var(--cobalt-soft); color:var(--cobalt-ink); padding:5px 10px; border-radius:999px; font-size:12px;">${c}</span>`).join('')}</div>
    <div class="flex justify-between mt-5 text-xs text-mute"><span>Target time: ${item.time} min</span><span>Difficulty: ${SOO.difficultyLabel(item.difficulty)}</span></div>`;
  showStage('feedback');
  if(window.renderMathInElement) renderMathInElement(card, {delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}]});
});

document.getElementById('btn-next').addEventListener('click', ()=>{
  if(idx < pool.length-1){ idx++; loadQuestion(); }
  else{
    clearInterval(timerInterval);
    document.getElementById('ps-progress-bar').style.width='100%';
    document.getElementById('sum-correct').textContent = `${correctCount}/${pool.length}`;
    document.getElementById('sum-accuracy').textContent = Math.round(correctCount/pool.length*100)+'%';
    const m=Math.floor(elapsed/60), s=elapsed%60;
    document.getElementById('sum-time').textContent = `${m}m ${s}s`;
    document.getElementById('sum-avg').textContent = Math.round(elapsed/pool.length)+'s';
    const weakSubj = SOO.subject(pool[0].subject);
    document.getElementById('sum-reco').textContent = `Consider a focused weak-area set in ${weakSubj.name} — your recent accuracy suggests ${weakSubj.topics[Math.floor(Math.random()*weakSubj.topics.length)]} needs another pass.`;
    showStage('summary');
  }
});

loadQuestion();

  } },
  'practice': { chrome:true, dimBg:false, init:function(){

setActiveNav('practice.html');

const modes = [
  { id:'quick', icon:'bolt', title:'Quick Practice', desc:'A short session, generated instantly across mixed topics.' },
  { id:'topic', icon:'book', title:'Topic Practice', desc:'Choose subject → topic → difficulty yourself.' },
  { id:'competition', icon:'trophy', title:'Competition Practice', desc:'Practice questions sourced from one specific competition.' },
  { id:'weak', icon:'target', title:'Weak Area Practice', desc:'Automatically targets topics where your accuracy lags.' },
  { id:'random', icon:'shuffle', title:'Random Challenge', desc:'Random high-quality questions across every subject.' },
  { id:'daily', icon:'flame', title:'Daily Challenge', desc:'One featured challenge per day. Keeps your streak alive.' },
  { id:'streak', icon:'flag', title:'Streak Practice', desc:'A light, fast session designed just to maintain your streak.' },
  { id:'exam', icon:'clock', title:'Exam Simulation', desc:'A timed, full-length simulation of a real competition round.' },
];
let activeMode = 'quick';
document.getElementById('mode-grid').innerHTML = modes.map(m=>`
  <div class="card card-hover mode-card" data-mode="${m.id}"><div class="m-icon">${icon(m.icon)}</div><h4>${m.title}</h4><p>${m.desc}</p></div>`).join('');

const subjParam = qs('subject');

function renderSetup(){
  const m = modes.find(x=>x.id===activeMode);
  document.getElementById('setup-eyebrow').textContent = m.title;
  document.getElementById('setup-title').textContent = 'Set up your session';
  document.querySelectorAll('.mode-card').forEach(c=>c.style.borderColor = c.dataset.mode===activeMode ? 'var(--gold)' : 'var(--line)');

  const subjOptions = SOO.subjects.map(s=>`<option value="${s.slug}" ${s.slug===subjParam?'selected':''}>${s.name}</option>`).join('');
  let fields = `<div class="field"><label>Subject</label><select id="opt-subject"><option value="all">All subjects</option>${subjOptions}</select></div>`;

  if(activeMode==='topic'){
    fields += `<div class="field"><label>Topic</label><select id="opt-topic"></select></div>`;
    fields += `<div class="field"><label>Difficulty</label><select id="opt-diff"><option value="0">Any</option><option value="1">Very Easy</option><option value="2">Easy</option><option value="3">Medium</option><option value="4">Hard</option><option value="5">Very Hard</option></select></div>`;
  } else if(activeMode==='competition'){
    fields = `<div class="field"><label>Competition</label><select id="opt-comp">${SOO.competitions.map(c=>`<option value="${c.slug}">${c.name}</option>`).join('')}</select></div>`;
    fields += `<div class="field"><label>Number of questions</label><select id="opt-count"><option>10</option><option>15</option><option selected>20</option></select></div>`;
  } else if(activeMode==='exam'){
    fields = `<div class="field"><label>Competition</label><select id="opt-comp">${SOO.competitions.map(c=>`<option value="${c.slug}">${c.name}</option>`).join('')}</select></div>`;
    fields += `<div class="field"><label>Time limit</label><select><option>60 minutes</option><option selected>90 minutes</option><option>180 minutes</option></select></div>`;
    fields += `<div class="field"><label>Questions</label><select><option selected>6 problems</option><option>4 problems</option></select></div>`;
  } else if(activeMode==='weak'){
    fields = `<div class="field"><label>Focus</label><select><option>Weakest 3 topics (auto-detected)</option><option>Weakest 1 topic only</option></select></div>`;
    fields += `<div class="field"><label>Number of questions</label><select><option>8</option><option selected>12</option><option>20</option></select></div>`;
  } else if(activeMode==='daily' || activeMode==='streak'){
    fields = `<p class="text-mute text-sm" style="grid-column:1/-1;">This mode is pre-configured — just start when you're ready.</p>`;
  } else {
    fields += `<div class="field"><label>Number of questions</label><select id="opt-count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>`;
    fields += `<div class="field"><label>Difficulty</label><select id="opt-diff"><option value="0">Adaptive (recommended)</option><option value="2">Easier</option><option value="4">Harder</option></select></div>`;
  }
  document.getElementById('setup-fields').innerHTML = fields;

  const optSubject = document.getElementById('opt-subject');
  if(optSubject) optSubject.addEventListener('change', refreshTopics);
  refreshTopics();

  const startBtn = document.getElementById('start-session');
  startBtn.setAttribute('data-route', `practice-session?mode=${activeMode}`);
}
function refreshTopics(){

  'questions': { chrome:true, dimBg:false, init:function(){

setActiveNav('questions.html');

const bookmarks = new Set();
document.getElementById('f-subject').innerHTML = `<label class="filter-opt"><input type="checkbox" class="f-subj" value="all" checked> All subjects</label>` +
  SOO.subjects.map(s=>`<label class="filter-opt"><input type="checkbox" class="f-subj" value="${s.slug}"> ${s.name}</label>`).join('');
document.getElementById('f-diff').innerHTML = [1,2,3,4,5].map(d=>`<label class="filter-opt"><input type="checkbox" class="f-diff" value="${d}" checked> ${SOO.difficultyLabel(d)}</label>`).join('');
const types = [...new Set(SOO.questions.map(q=>q.type))];
document.getElementById('f-type').innerHTML = `<label class="filter-opt"><input type="checkbox" class="f-typ" value="all" checked> All types</label>` +
  types.map(t=>`<label class="filter-opt"><input type="checkbox" class="f-typ" value="${t}"> ${t}</label>`).join('');

const params = new URLSearchParams(location.search);
if(params.get('subject')){ document.querySelectorAll('.f-subj').forEach(cb=>cb.checked = cb.value===params.get('subject')); }

function render(){
  const q = document.getElementById('q-search').value.trim().toLowerCase();
  const subjChecked = [...document.querySelectorAll('.f-subj')].filter(c=>c.checked).map(c=>c.value);
  const diffChecked = [...document.querySelectorAll('.f-diff')].filter(c=>c.checked).map(c=>Number(c.value));
  const typChecked = [...document.querySelectorAll('.f-typ')].filter(c=>c.checked).map(c=>c.value);
  const bookmarkedOnly = document.getElementById('f-bookmarked').checked;
  const unsolvedOnly = document.getElementById('f-unsolved').checked;
  const sortBy = document.getElementById('sort-by').value;

  let list = SOO.questions.filter(item=>{
    if(q && !(item.title.toLowerCase().includes(q) || item.topic.toLowerCase().includes(q) || item.id.toLowerCase().includes(q))) return false;
    if(!subjChecked.includes('all') && !subjChecked.includes(item.subject)) return false;
    if(!diffChecked.includes(item.difficulty)) return false;
    if(!typChecked.includes('all') && !typChecked.includes(item.type)) return false;
    if(bookmarkedOnly && !bookmarks.has(item.id)) return false;
    if(unsolvedOnly && item.solved > 60) return false;
    return true;
  });
  if(sortBy==='difficulty-asc') list.sort((a,b)=>a.difficulty-b.difficulty);
  if(sortBy==='difficulty-desc') list.sort((a,b)=>b.difficulty-a.difficulty);
  if(sortBy==='year') list.sort((a,b)=>b.year-a.year);
  if(sortBy==='solved') list.sort((a,b)=>b.solved-a.solved);

  document.getElementById('result-count').textContent = `${list.length} question${list.length===1?'':'s'} found`;
  document.getElementById('q-empty').classList.toggle('hidden', list.length>0);
  document.getElementById('q-list').innerHTML = list.map((item,i)=>{
    const sub = SOO.subject(item.subject);
    return `<div class="q-row" style="${i<list.length-1?'border-bottom:1px solid var(--line-soft);':''}">
      <a data-route="question-detail?id=${item.id}" role="link" tabindex="0" class="q-main">
        <div class="q-title">${item.title}</div>
        <div class="q-meta">
          <span class="subject-chip sc-${sub.slug}">${sub.name}</span>
          <span>${item.topic}</span>
          <span>${item.competition.toUpperCase()} ${item.year}</span>
          <span class="diff-dots">${[1,2,3,4,5].map(d=>`<i class="${d<=item.difficulty?'on':''}"></i>`).join('')}</span>
          <span>${icon('clock','')} ${item.time} min</span>
          <span class="solved-badge">${item.solved}% solve rate</span>
        </div>
      </a>
      <div class="q-actions">
        <button class="btn-icon bm-btn" data-id="${item.id}" aria-label="Bookmark">${icon('bookmark')}</button>
        <a data-route="question-detail?id=${item.id}" role="link" tabindex="0" class="btn btn-outline btn-sm">Start</a>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.bm-btn').forEach(b=>b.addEventListener('click', ()=>{
    const id=b.dataset.id;
    if(bookmarks.has(id)){ bookmarks.delete(id); } else { bookmarks.add(id); sooToast('Question bookmarked','bookmark'); }
    render();
  }));
}
['q-search'].forEach(id=>document.getElementById(id).addEventListener('input', render));
document.querySelectorAll('.filter-box input[type=checkbox]').forEach(c=>c.addEventListener('change', ()=>{
  if(c.classList.contains('f-subj')){
    if(c.value==='all' && c.checked) document.querySelectorAll('.f-subj').forEach(x=>{if(x.value!=='all')x.checked=false;});
    else if(c.value!=='all' && c.checked) document.querySelector('.f-subj[value=all]').checked=false;
  }
  if(c.classList.contains('f-typ')){
    if(c.value==='all' && c.checked) document.querySelectorAll('.f-typ').forEach(x=>{if(x.value!=='all')x.checked=false;});
    else if(c.value!=='all' && c.checked) document.querySelector('.f-typ[value=all]').checked=false;
  }
  render();
}));
document.getElementById('sort-by').addEventListener('change', render);
document.getElementById('reset-filters').addEventListener('click', ()=>{
  document.getElementById('q-search').value='';
  document.querySelectorAll('.f-subj').forEach(c=>c.checked = c.value==='all');
  document.querySelectorAll('.f-diff').forEach(c=>c.checked = true);
  document.querySelectorAll('.f-typ').forEach(c=>c.checked = c.value==='all');
  document.getElementById('f-bookmarked').checked=false;
  document.getElementById('f-unsolved').checked=false;
  render();
});
render();

  } },

/* ---------- Pure JS-state router (NO href/hash navigation at all) ----------
   Claude's artifact preview intercepts clicks on <a> tags that carry a real
   href and shows a "leaving Claude" confirmation, even for in-page hash
   anchors. To guarantee every page stays inside this document, internal
   navigation never touches location.href/location.hash — it's driven
   entirely by a JS state variable plus a delegated click handler on
   [data-route] elements (which carry no href at all). */

let __route = { path: 'index', query: new URLSearchParams() };

function goTo(routeStr){
  routeStr = (routeStr || 'index').toString().replace(/\.html\b/, '');
  const qIdx = routeStr.indexOf('?');
  const path = qIdx === -1 ? routeStr : routeStr.slice(0, qIdx);
  const query = qIdx === -1 ? '' : routeStr.slice(qIdx + 1);
  render(path || 'index', new URLSearchParams(query));
}

function render(path, query){
  clearAllTrackedIntervals();
  const drawer = document.getElementById('mobile-drawer');
  if(drawer) drawer.classList.remove('open');
  const searchScrim = document.getElementById('search-scrim');
  if(searchScrim) searchScrim.classList.remove('open');
  const notifScrim = document.getElementById('notif-scrim');
  if(notifScrim) notifScrim.classList.remove('open');

  window.__routeQuery = query;
  const key = ROUTES[path] ? path : 'index';
  __route = { path: key, query: query };
  const route = ROUTES[key];

  const tpl = document.getElementById('tpl-' + key);
  document.getElementById('app-root').innerHTML = tpl ? tpl.innerHTML : '<div class="section container"><div class="empty-state"><h3>Page not found</h3></div></div>';

  const headerEl = document.getElementById('site-header');
  const footerEl = document.getElementById('site-footer');
  headerEl.style.display = route.chrome ? '' : 'none';
  footerEl.style.display = route.chrome ? '' : 'none';
  document.body.classList.toggle('shell-dim', !!route.dimBg);
  document.body.classList.toggle('no-chrome', !route.chrome);

  window.scrollTo(0,0);

  try{
    if(route.init) route.init();
  }catch(e){
    console.error('Route init error for "' + key + '":', e);
  }

  const anchor = query.get('anchor');
  if(anchor){
    setTimeout(()=>{
      const el = document.getElementById(anchor);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 60);
  }
}

/* Delegated click handler: any element carrying data-route navigates
   internally. No href is ever involved, so there is nothing for the
   platform's link-interception to catch. */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-route]');
  if(el){
    e.preventDefault();
    goTo(el.getAttribute('data-route'));
    return;
  }
  const scrollEl = e.target.closest('[data-scroll-to]');
  if(scrollEl){
    e.preventDefault();
    const target = document.getElementById(scrollEl.getAttribute('data-scroll-to'));
    if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
  }
});
/* keyboard activation for accessibility, since these elements carry no href */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-route]');
  if(el){
    e.preventDefault();
    goTo(el.getAttribute('data-route'));
    return;
  }
  const scrollEl = e.target.closest('[data-scroll-to]');
  if(scrollEl){
    e.preventDefault();
    const target = document.getElementById(scrollEl.getAttribute('data-scroll-to'));
    if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
  }
});

window.goTo = goTo;
window.addEventListener('DOMContentLoaded', function(){
  initTheme();
  renderHeader('');
  renderFooter();
  goTo('index');
});

</script>
